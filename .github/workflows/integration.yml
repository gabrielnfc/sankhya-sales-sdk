name: Integration Tests

on:
  push:
    branches: [main]
  schedule:
    # Nightly contract check against the Sankhya sandbox — 05:37 UTC (~02:37 BRT).
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      run_wms_lane:
        description: 'Rodar tambem a lane WMS (ESCREVE pedido descartavel no sandbox e apaga por id)'
        type: boolean
        default: false

# Nao existe gatilho `pull_request` aqui, de proposito: esta lane escreve no ERP
# de homologacao e PR de fork exporia os secrets. `tests/security/ci-lanes.test.ts`
# trava a ausencia desse gatilho e roda no CI de PR.

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANKHYA_BASE_URL: ${{ secrets.SANKHYA_BASE_URL }}
      SANKHYA_CLIENT_ID: ${{ secrets.SANKHYA_CLIENT_ID }}
      SANKHYA_CLIENT_SECRET: ${{ secrets.SANKHYA_CLIENT_SECRET }}
      SANKHYA_X_TOKEN: ${{ secrets.SANKHYA_X_TOKEN }}
      # Opt-in duplo: a lane WMS so roda em execucao manual que marque a caixa.
      # Nos demais gatilhos (push, schedule) a variavel fica vazia e a suite se
      # auto-pula imprimindo o motivo.
      SDK_INTEGRATION_WMS: ${{ inputs.run_wms_lane && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run integration tests
        if: ${{ env.SANKHYA_BASE_URL != '' }}
        # Push to main stays informational (sandbox flakiness must not block).
        # Scheduled / manual runs fail hard so a real regression is visible (and
        # GitHub emails the owner on a failed scheduled run).
        continue-on-error: ${{ github.event_name == 'push' }}
        id: integration
        run: npm run test:integration
      - name: Report results
        if: ${{ env.SANKHYA_BASE_URL != '' }}
        run: |
          if [ "${{ steps.integration.outcome }}" = "failure" ]; then
            echo "::warning::Integration tests failed — sandbox may be unreachable from GitHub Actions IPs"
          else
            echo "Integration tests passed"
          fi
      - name: Skip notice
        if: ${{ env.SANKHYA_BASE_URL == '' }}
        run: echo "Skipping integration tests — SANKHYA secrets not configured"
