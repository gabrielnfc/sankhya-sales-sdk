name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - name: Quality checks and build
        run: npm run prepublishOnly

      # OIDC Trusted Publishing requires npm >= 11.5.1; setup-node ships npm 10.x.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: auth comes from the GitHub OIDC id-token (id-token: write
      # above) against the Trusted Publisher configured on npmjs.com. Provenance is
      # attached automatically. Exempt from the account's 2FA-for-writes policy.
      - name: Publish to npm with provenance (OIDC trusted publishing)
        run: npm publish --provenance --access public

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: false
